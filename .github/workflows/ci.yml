# The CI of docker-sqlite: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template,
# its CI.md). The scripts build, typecheck and test run on the maintained LTS lines of Node.js and on
# the current line.
name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@072c68a9d4b3fbaea886ad60ae54b6ebbef42bde # main
    with:
      # tsc -b writes dist, as release.yml builds it
      scripts: build typecheck test
      # The maintained LTS lines and the current line
      node-versions: '["22", "24", "26"]'
