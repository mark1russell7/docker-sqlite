name: Release

# Publishes the package to npm when a version tag (for example v0.1.1) is pushed.
# npm trusted publishing uses the OIDC token of GitHub Actions, so the workflow
# needs no npm token, and the package gets a provenance statement.
# docs/release.md tells how to set up the trusted publisher one time.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The owner approves each publish in the settings of the environment
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: The tag agrees with the version of package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm pack --dry-run
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@latest
      # The steps above built and tested the package
      - run: npm publish --provenance --access public --ignore-scripts
